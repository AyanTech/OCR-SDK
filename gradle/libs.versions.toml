[versions]
agp = "9.3.0"
kotlin = "2.4.0"
ksp = "2.3.9"
androidx-core = "1.16.0"
androidx-appcompat = "1.7.1"
material = "1.12.0"
constraintlayout = "2.2.1"
camerax = "1.4.2"
junit4 = "4.13.2"
androidx-test-junit = "1.3.0"
espresso = "3.7.0"
glide = "4.16.0"
whygoogle = "0.8.2"
versioncontrol = "0.6.4"
okhttp = "5.4.0"
chucker = "4.0.0"
networking = "1.6.7"
picasso = "2.71828"
coroutines = "1.11.0"
circleimageview = "3.1.0"
lottie = "6.7.1"
documentfile = "1.1.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-video = { module = "androidx.camera:camera-video", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
androidx-camera-extensions = { module = "androidx.camera:camera-extensions", version.ref = "camerax" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
whygoogle = { module = "com.github.shadowalker77:whygoogle", version.ref = "whygoogle" }
versioncontrol = { module = "com.github.ayantech:versioncontrol", version.ref = "versioncontrol" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
chucker = { module = "com.github.chuckerteam.chucker:library", version.ref = "chucker" }
chucker-no-op = { module = "com.github.chuckerteam.chucker:library-no-op", version.ref = "chucker" }
networking = { module = "com.github.shadowalker77:networking", version.ref = "networking" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
circleimageview = { module = "de.hdodenhof:circleimageview", version.ref = "circleimageview" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

[bundles]
android-ui = [
    "androidx-core-ktx",
    "androidx-appcompat",
    "material",
    "androidx-constraintlayout",
]
camerax = [
    "androidx-camera-core",
    "androidx-camera-camera2",
    "androidx-camera-lifecycle",
    "androidx-camera-video",
    "androidx-camera-view",
    "androidx-camera-extensions",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
